openapi: 3.0.0
info:
  title: CVRPTW Solver API
  description: API for solving vehicle routing problem (VRP) with loaders
  version: 1.0.0
  contact:
    name: Team 10

servers:
  - url: http://139.100.207.201:5000
    description: MVPv0
  - url: http://139.100.207.201:5001
    description: MVPv1
  - url: http://localhost:5002
    description: MVPv2

security:
  - Auth: []

paths:
  /solve:
    post:
      summary: Start solving VRP
      description: |
        Accepts a CVRPTW scenario and starts solving in background.
        Returns immediately with status "started". Poll /solution for result.
      operationId: startSolving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario'
            examples:
              simple:
                summary: сценарий 1
                value:
                  vehicle_capacity: 1000
                  vehicle_speed: 3
                  loader_speed: 1
                  vehicle_shift_size: 720
                  loader_shift_size: 720
                  depot:
                    id: 0
                    x: 100
                    y: 100
                    load_time: 40
                  orders:
                    - id: 1
                      x: 134
                      y: 6
                      volume: 20
                      time_window: [988, 1031]
                      vehicle_service_time: 10
                      loader_cnt: 0
                      loader_service_time: 0
                      optional: 0
                  weights:
                    vehicle_salary: 380
                    loader_salary: 230
                    fuel_cost: 2
                    loader_work: 1
                    optional_order_penalty: 164
      responses:
        '202':
          description: Computation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: started
        '409':
          description: Already computing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: computing
                  message:
                    type: string
                    example: Already solving
        '400':
          description: Invalid request / Scenario cannot be solved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /solution:
    get:
      summary: Get computed solution
      description: |
        Returns the solution if computation is done,
        or current status (computing / idle / error).
      operationId: getSolution
      responses:
        '200':
          description: Solution or status
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        example: done
                      solution:
                        $ref: '#/components/schemas/Solution'
                  - type: object
                    properties:
                      status:
                        type: string
                        example: computing
                      remaining_time_seconds:
                        type: integer
                        description: Estimated seconds until computation finishes
                        example: 85
                  - type: object
                    properties:
                      status:
                        type: string
                        example: idle
                      message:
                        type: string
        '500':
          description: Computation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string

  /metrics:
    get:
      summary: Get computation statistics
      description: |
        Returns cost metrics if computation is done,
        or current status (computing / idle / error).
      operationId: getMetrics
      responses:
        '200':
          description: Statistics or status
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        example: done
                      statistics:
                        $ref: '#/components/schemas/Statistics'
                  - type: object
                    properties:
                      status:
                        type: string
                        example: computing
                      remaining_time_seconds:
                        type: integer
                        description: Estimated seconds until computation finishes
                        example: 85
                  - type: object
                    properties:
                      status:
                        type: string
                        example: idle
                      message:
                        type: string
        '500':
          description: Computation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string

  /validation:
    post:
      summary: Validate input scenario
      description: |
        Validates a CVRPTW scenario JSON without starting computation.
        Returns errors with paths pointing to the invalid fields.
      operationId: validateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario'
      responses:
        '200':
          description: Input is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  errors:
                    type: array
                    description: List of validation errors
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Path to the invalid field (e.g. depot.x, orders[0].volume)
                          example: depot.load_time
                        message:
                          type: string
                          description: Error description
                          example: Must be >= 0, got -1

  /health:
    get:
      summary: Service health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    Scenario:
      type: object
      required:
        - vehicle_capacity
        - vehicle_speed
        - loader_speed
        - vehicle_shift_size
        - loader_shift_size
        - depot
        - orders
        - weights
      properties:
        vehicle_capacity:
          type: number
          description: Vehicle capacity
          example: 1000
        vehicle_speed:
          type: number
          description: Vehicle speed (distance/time)
          example: 3
        loader_speed:
          type: number
          description: Loader speed
          example: 1
        vehicle_shift_size:
          type: number
          description: Vehicle shift duration
          example: 720
        loader_shift_size:
          type: number
          description: Loader shift duration
          example: 720
        depot:
          $ref: '#/components/schemas/Depot'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        weights:
          $ref: '#/components/schemas/Weights'

    Depot:
      type: object
      required:
        - id
        - x
        - y
        - load_time
      properties:
        id:
          type: integer
          example: 0
        x:
          type: number
          example: 100
        y:
          type: number
          example: 100
        load_time:
          type: number
          description: Loading time
          example: 40

    Order:
      type: object
      required:
        - id
        - x
        - y
        - volume
        - time_window
        - vehicle_service_time
        - loader_cnt
        - loader_service_time
        - optional
      properties:
        id:
          type: integer
          example: 1
        x:
          type: number
          example: 134
        y:
          type: number
          example: 6
        volume:
          type: number
          example: 20
        time_window:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [988, 1031]
        vehicle_service_time:
          type: number
          description: Vehicle service time per order
          example: 10
        loader_cnt:
          type: integer
          description: Required number of loaders
          example: 0
        loader_service_time:
          type: number
          description: Loader service time per order
          example: 0
        optional:
          type: boolean
          description: Whether the order is optional
          example: 0

    Weights:
      type: object
      properties:
        vehicle_salary:
          type: number
          example: 380
        loader_salary:
          type: number
          example: 230
        fuel_cost:
          type: number
          example: 2
        loader_work:
          type: number
          example: 1
        optional_order_penalty:
          type: number
          example: 164

    Solution:
      type: object
      required:
        - vehicles
        - loaders
        - verification
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleRoute'
        loaders:
          type: array
          items:
            $ref: '#/components/schemas/LoaderRoute'
        verification:
          $ref: '#/components/schemas/Verification'

    VehicleRoute:
      type: object
      required:
        - id
        - route
        - time
      properties:
        id:
          type: integer
          description: Vehicle ID
          example: 1
        route:
          type: array
          items:
            type: integer
          description: Route (0 - depot, positive - order IDs)
          example: [0, 1, 2, 3, 0]
        time:
          type: array
          items:
            type: number
          description: Start time of operations at each route point
          example: [0, 100, 200, 300, 400]

    LoaderRoute:
      type: object
      required:
        - id
        - route
      properties:
        id:
          type: integer
          description: Loader ID
          example: 1
        route:
          type: array
          items:
            type: integer
          description: Loader route (order IDs)
          example: [1, 2, 3]

    Statistics:
      type: object
      required:
        - total_cost
        - fuel_cost
        - vehicle_salaries
        - loader_salaries
        - loader_work_cost
        - penalties
      properties:
        total_cost:
          type: number
          description: Total cost (sum of all components)
          example: 14383.72
        fuel_cost:
          type: number
          description: Fuel cost (total distance × fuel_cost)
          example: 2452.88
        vehicle_salaries:
          type: number
          description: Vehicle salaries (count × vehicle_salary)
          example: 4940
        loader_salaries:
          type: number
          description: Loader salaries (count × loader_salary)
          example: 4140
        loader_work_cost:
          type: number
          description: Loader work cost (total shift × loader_work)
          example: 2194.84
        penalties:
          type: number
          description: Penalties for missed optional orders
          example: 656

    Verification:
      type: object
      properties:
        shift_verification:
          type: object
          description: Shift time verification results
        time_window_verification:
          type: object
          description: Time window verification results
        capacity_verification:
          type: object
          description: Capacity verification results

    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid request body
        message:
          type: string
          example: Missing required field 'vehicle_capacity'
        code:
          type: integer
          example: 400

  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: X-API-Key
