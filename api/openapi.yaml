openapi: 3.0.0
info:
  title: CVRPTW Solver API
  description: API для решения задачи маршрутизации транспортных средств с грузчиками
  version: 1.0.0
  contact:
    name: Team 10

servers:
  - url: http://139.100.207.201:5000/solve
    description: Production server

paths:
  /solve:
    post:
      summary: Решить задачу маршрутизации
      description: |
        Принимает сценарий CVRPTW с грузчиками и возвращает оптимальные маршруты
        для транспортных средств и грузчиков.
      operationId: solveCVRPTW
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario'
            examples:
              simple:
                summary: сценарий 1
                value:
                  vehicle_capacity: 1000
                  vehicle_speed: 3
                  loader_speed: 1
                  vehicle_shift_size: 720
                  loader_shift_size: 720
                  depot:
                    id: 0
                    x: 100
                    y: 100
                    load_time: 40
                  orders:
                    - id: 1
                      x: 134
                      y: 6
                      volume: 20
                      time_window: [988, 1031]
                      vehicle_service_time: 10
                      loader_cnt: 0
                      loader_service_time: 0
                      optional: 0
                  weights:
                    order_penalty: 250
                    take_vehicle: 200
                    add_loader: 200
                    fuel_cost: 2
                    loader_work: 1
      responses:
        '200':
          description: Решение найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solution'
              examples:
                success:
                  summary: Пример решения
                  value:
                    vehicles:
                      - id: 1
                        route: [0, 1, 2, 0]
                        time: [0, 100, 200, 300]
                    loaders:
                      - id: 1
                        route: [1, 2]
        '400':
          description: Невалидный запрос/Сценарий не может быть решён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера

  /health:
    get:
      summary: Проверка состояния сервиса
      operationId: healthCheck
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    Scenario:
      type: object
      required:
        - vehicle_capacity
        - vehicle_speed
        - loader_speed
        - vehicle_shift_size
        - loader_shift_size
        - depot
        - orders
        - weights
      properties:
        vehicle_capacity:
          type: number
          description: Вместимость транспортного средства
          example: 1000
        vehicle_speed:
          type: number
          description: Скорость ТС (расстояние/время)
          example: 3
        loader_speed:
          type: number
          description: Скорость грузчика
          example: 1
        vehicle_shift_size:
          type: number
          description: Длительность смены ТС
          example: 720
        loader_shift_size:
          type: number
          description: Длительность смены грузчика
          example: 720
        depot:
          $ref: '#/components/schemas/Depot'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        weights:
          $ref: '#/components/schemas/Weights'

    Depot:
      type: object
      required:
        - id
        - x
        - y
        - load_time
      properties:
        id:
          type: integer
          example: 0
        x:
          type: number
          example: 100
        y:
          type: number
          example: 100
        load_time:
          type: number
          description: Время погрузки
          example: 40

    Order:
      type: object
      required:
        - id
        - x
        - y
        - volume
        - time_window
        - vehicle_service_time
        - loader_cnt
        - loader_service_time
        - optional
      properties:
        id:
          type: integer
          example: 1
        x:
          type: number
          example: 134
        y:
          type: number
          example: 6
        volume:
          type: number
          example: 20
        time_window:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [988, 1031]
        vehicle_service_time:
          type: number
          description: Время работы ТС на заказе
          example: 10
        loader_cnt:
          type: integer
          description: Требуемое количество грузчиков
          example: 0
        loader_service_time:
          type: number
          description: Время работы грузчиков на заказе
          example: 0
        optional:
          type: boolean
          description: Обязательность выполнения заказа
          example: 0

    Weights:
      type: object
      properties:
        order_penalty:
          type: number
          example: 250
        take_vehicle:
          type: number
          example: 200
        add_loader:
          type: number
          example: 200
        fuel_cost:
          type: number
          example: 2
        loader_work:
          type: number
          example: 1

    Solution:
      type: object
      required:
        - vehicles
        - loaders
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleRoute'
        loaders:
          type: array
          items:
            $ref: '#/components/schemas/LoaderRoute'

    VehicleRoute:
      type: object
      required:
        - id
        - route
        - time
      properties:
        id:
          type: integer
          description: ID транспортного средства
          example: 1
        route:
          type: array
          items:
            type: integer
          description: Маршрут (0 - depot, положительные - ID заказов)
          example: [0, 1, 2, 3, 0]
        time:
          type: array
          items:
            type: number
          description: Время начала операций на каждой точке маршрута
          example: [0, 100, 200, 300, 400]

    LoaderRoute:
      type: object
      required:
        - id
        - route
      properties:
        id:
          type: integer
          description: ID грузчика
          example: 1
        route:
          type: array
          items:
            type: integer
          description: Маршрут грузчика (ID заказов)
          example: [1, 2, 3]

    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid request body
        message:
          type: string
          example: Missing required field 'vehicle_capacity'
        code:
          type: integer
          example: 400

  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: X-API-Key
