le="stroke:#181818;stroke-width:0.5;"/><text x="169.68" y="370.742" fill="#000" font-size="14" textLength="120.634">Flask API Process</text><text x="169.68" y="387.039" fill="#000" font-size="14" textLength="172.635">(Web/app.py, port 5022)</text></g><!--entity Pipeline--><g class="entity" data-qualified-name="Host.Container.Pipeline" id="ent0006" data-source-line="10"><rect x="538.11" y="329.597" width="355.772" height="78.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="873.882" y="334.597" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="871.882" y="336.597" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="871.882" y="340.597" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="553.11" y="362.592" fill="#000" font-size="14" textLength="103.544">Solver Pipeline</text><text x="553.11" y="378.889" fill="#000" font-size="14" textLength="315.772">(CP-SAT/main.py + CP-SAT/vehicle_routes.py</text><text x="553.11" y="395.186" fill="#000" font-size="14" textLength="194.147">+ CP-SAT/loader_routes.py)</text></g><!--entity DataDir--><g class="entity" data-qualified-name="Host.Container.DataDir" id="ent0007" data-source-line="11"><path d="M695.93,507.437 L736.93,507.437 A3.75,3.75 0 0 1 739.43,509.937 L746.43,528.437 L902.076,528.437 A2.5,2.5 0 0 1 904.576,530.937 L904.576,591.828 A2.5,2.5 0 0 1 902.076,594.328 L695.93,594.328 A2.5,2.5 0 0 1 693.43,591.828 L693.43,509.937 A2.5,2.5 0 0 1 695.93,507.437" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><line x1="693.43" y1="528.437" x2="746.43" y2="528.437" style="stroke:#181818;stroke-width:0.5;"/><text x="703.43" y="548.432" fill="#000" font-size="14" textLength="74.874">/ROP/data/</text><text x="703.43" y="564.729" fill="#000" font-size="14" textLength="181.146">(input.json, output.json —</text><text x="703.43" y="581.026" fill="#000" font-size="14" textLength="119.041">live scratch files)</text></g><!--entity Snapshots--><g class="entity" data-qualified-name="Host.Container.Snapshots" id="ent0008" data-source-line="12"><path d="M366.07,507.437 L407.07,507.437 A3.75,3.75 0 0 1 409.57,509.937 L416.57,528.437 L655.928,528.437 A2.5,2.5 0 0 1 658.428,530.937 L658.428,591.828 A2.5,2.5 0 0 1 655.928,594.328 L366.07,594.328 A2.5,2.5 0 0 1 363.57,591.828 L363.57,509.937 A2.5,2.5 0 0 1 366.07,507.437" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><line x1="363.57" y1="528.437" x2="416.57" y2="528.437" style="stroke:#181818;stroke-width:0.5;"/><text x="373.57" y="548.432" fill="#000" font-size="14" textLength="264.858">/ROP/data/inputs/, /ROP/data/outputs/</text><text x="373.57" y="564.729" fill="#000" font-size="14" textLength="189.841">(per-calculation snapshots,</text><text x="373.57" y="581.026" fill="#000" font-size="14" textLength="152.147">{calculation_id}.json)</text></g><!--entity HistoryDB--><g class="entity" data-qualified-name="Host.Container.HistoryDB" id="ent0009" data-source-line="13"><path d="M71.7,530.087 C71.7,520.087 200.003,520.087 200.003,520.087 C200.003,520.087 328.305,520.087 328.305,530.087 L328.305,571.681 C328.305,581.681 200.003,581.681 200.003,581.681 C200.003,581.681 71.7,581.681 71.7,571.681 L71.7,530.087" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M71.7,530.087 C71.7,540.087 200.003,540.087 200.003,540.087 C200.003,540.087 328.305,540.087 328.305,530.087" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="81.7" y="557.082" fill="#000" font-size="14" textLength="145.25">/ROP/data/history.db</text><text x="81.7" y="573.379" fill="#000" font-size="14" textLength="236.605">(SQLite, calculation_history table)</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="25"><path d="M623.74,697.327 L623.74,904.053 A0,0 0 0 0 623.74,904.053 L974.26,904.053 A0,0 0 0 0 974.26,904.053 L974.26,707.327 L964.26,697.327 L803,697.327 L799,594.767 L795,697.327 L623.74,697.327 A0,0 0 0 0 623.74,697.327" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M964.26,697.327 L964.26,707.327 L974.26,707.327 L964.26,697.327" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="629.74" y="714.394" fill="#000" font-size="13" textLength="285.149">data/ is COPY'd into the image at build time</text><text x="629.74" y="729.527" fill="#000" font-size="13" textLength="295.49">(Dockerfile: COPY data/ data/), and WORKDIR</text><text x="629.74" y="744.659" fill="#000" font-size="13" textLength="293.541">is /ROP, so the process resolves DATA_DIR to</text><text x="629.74" y="759.792" fill="#000" font-size="13" textLength="69.278">/ROP/data.</text><text x="629.74" y="774.925" fill="#000" font-size="13" textLength="329.52">docker-compose.yml mounts ./data:/MVPv2.2/data</text><text x="629.74" y="790.058" fill="#000" font-size="13" textLength="314.368">as a volume — a DIFFERENT container path that</text><text x="629.74" y="805.191" fill="#000" font-size="13" textLength="290.761">the Flask process never reads from or writes</text><text x="629.74" y="820.323" fill="#000" font-size="13" textLength="244.791">to. As a result, input.json/output.json,</text><text x="629.74" y="835.456" fill="#000" font-size="13" textLength="294.747">history.db, and the per-calculation snapshots</text><text x="629.74" y="850.589" fill="#000" font-size="13" textLength="270.886">currently do NOT persist across container</text><text x="629.74" y="865.722" fill="#000" font-size="13" textLength="299.501">rebuilds. This mismatch pre-dates this update</text><text x="629.74" y="880.855" fill="#000" font-size="13" textLength="284.458">and is worth fixing independently (align the</text><text x="629.74" y="895.988" fill="#000" font-size="13" textLength="284.096">volume path with /ROP/data, or vice versa).</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="41"><path d="M984.66,500.487 L984.66,601.284 L1323.341,601.284 L1323.341,510.487 L1313.341,500.487 L984.66,500.487" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1313.341,500.487 L1313.341,510.487 L1323.341,510.487 L1313.341,500.487" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="990.66" y="517.554" fill="#000" font-size="13" textLength="317.681">New in this version (ADR-007). Single embedded</text><text x="990.66" y="532.687" fill="#000" font-size="13" textLength="299.616">SQLite file — no separate database container.</text><text x="990.66" y="547.819" fill="#000" font-size="13" textLength="274.98">Single-writer: a second API replica sharing</text><text x="990.66" y="562.952" fill="#000" font-size="13" textLength="291.427">this file would risk lock contention, matching</text><text x="990.66" y="578.085" fill="#000" font-size="13" textLength="269.052">the existing single-instance constraint on</text><text x="990.66" y="593.218" fill="#000" font-size="13" textLength="154.654">solver_state (ADR-002).</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="50"><path d="M985.07,341.347 L985.07,396.745 L1218.939,396.745 L1218.939,351.347 L1208.939,341.347 L985.07,341.347" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1208.939,341.347 L1208.939,351.347 L1218.939,351.347 L1208.939,341.347" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="991.07" y="358.414" fill="#000" font-size="13" textLength="210.952">Single container, single process.</text><text x="991.07" y="373.547" fill="#000" font-size="13" textLength="212.869">No reverse proxy, load balancer,</text><text x="991.07" y="388.679" fill="#000" font-size="13" textLength="198.136">or orchestration layer defined.</text></g><!--link Client to API--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk10" data-source-line="17" data-link-type="dependency"><path d="M261,129.667 C261,176.317 261,279.517 261,332.587" style="stroke:#181818;stroke-width:1;" fill="none" id="Client-to-API"/><polygon points="261,337.587,265,328.587,261,332.587,257,328.587,261,337.587" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="342.888" y="174.664" fill="#000" font-size="13" textLength="33.497">HTTP</text><text x="262" y="189.797" fill="#000" font-size="13" textLength="195.273">(port 5022, X-API-Key header)</text></g><!--link API to Pipeline--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-source-line="18" data-link-type="dependency"><path d="M367.68,369.037 C418.37,369.037 475.34,369.037 532.88,369.037" style="stroke:#181818;stroke-width:1;" fill="none" id="API-to-Pipeline"/><polygon points="537.88,369.037,528.88,365.037,532.88,369.037,528.88,373.037,537.88,369.037" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="406.267" y="347.104" fill="#000" font-size="13" textLength="93.253">in-process call</text><text x="385.72" y="362.237" fill="#000" font-size="13" textLength="134.348">(background thread)</text></g><!--link Pipeline to DataDir--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk12" data-source-line="19" data-link-type="dependency"><path d="M733.81,408.627 C747.14,437.517 763.295,493.517 777.095,523.417" style="stroke:#181818;stroke-width:1;" fill="none" id="Pipeline-to-DataDir"/><polygon points="779.19,527.957,779.05,518.109,777.095,523.417,771.787,521.461,779.19,527.957" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="760" y="459.054" fill="#000" font-size="13" textLength="102.8">read/write JSON</text></g><!--link API to DataDir--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk13" data-source-line="20" data-link-type="dependency"><path d="M367.51,390.877 C421.62,402.647 488.02,418.937 546,438.487 C602.62,457.577 659.483,482.324 707.603,504.894" style="stroke:#181818;stroke-width:1;" fill="none" id="API-to-DataDir"/><polygon points="712.13,507.017,705.68,499.574,707.603,504.894,702.283,506.816,712.13,507.017" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="625" y="459.054" fill="#000" font-size="13" textLength="102.8">read/write JSON</text></g><!--link API to Snapshots--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" id="lnk14" data-source-line="21" data-link-type="dependency"><path d="M317.84,400.737 C337.35,411.937 359.04,425.147 378,438.487 C407.8,459.467 435.384,503.208 460.144,524.828" style="stroke:#181818;stroke-width:1;" fill="none" id="API-to-Snapshots"/><polygon points="463.91,528.117,459.762,519.184,460.144,524.828,454.5,525.21,463.91,528.117" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="420" y="451.554" fill="#000" font-size="13" textLength="117.514">write input/output</text><text x="421.416" y="466.687" fill="#000" font-size="13" textLength="114.683">per calculation_id</text></g><!--link API to HistoryDB--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" id="lnk15" data-source-line="22" data-link-type="dependency"><path d="M250.65,400.547 C239.37,433.817 223.027,482.002 211.797,515.092" style="stroke:#181818;stroke-width:1;" fill="none" id="API-to-HistoryDB"/><polygon points="210.19,519.827,216.87,512.59,211.797,515.092,209.295,510.019,210.19,519.827" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="255.732" y="451.554" fill="#000" font-size="13" textLength="96.484">SQL read/write</text><text x="238" y="466.687" fill="#000" font-size="13" textLength="131.949">(calculation_history)</text></g><!--link HistoryDB to GMN19--><g class="link" data-entity-1="ent0009" data-entity-2="ent0020" id="lnk21" data-source-line="41" data-link-type="association"><path d="M238.91,519.797 C270.43,496.727 317.09,467.147 363.5,454.487 C595.04,