font-size="14" lengthAdjust="spacing" textLength="133" x="87.5" y="379.9917">(app.py, port 5002)</text></g><!--entity Pipeline--><g id="elem_Pipeline"><rect fill="#F1F1F1" height="62.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="375" x="408.5" y="329.9683"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="763.5" y="334.9683"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="761.5" y="336.9683"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="761.5" y="340.9683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100" x="423.5" y="363.5034">Solver Pipeline</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335" x="423.5" y="379.9917">(main.py + vehicle_routes.py + loader_routes.py)</text></g><!--entity DataDir--><g id="elem_DataDir"><path d="M213.5,469.9483 L254.5,469.9483 A3.75,3.75 0 0 1 257,472.4483 L264,490.9483 L404.5,490.9483 A2.5,2.5 0 0 1 407,493.4483 L407,538.4248 A2.5,2.5 0 0 1 404.5,540.9248 L213.5,540.9248 A2.5,2.5 0 0 1 211,538.4248 L211,472.4483 A2.5,2.5 0 0 1 213.5,469.9483 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="211" x2="264" y1="490.9483" y2="490.9483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79" x="221" y="511.4834">/ROP/data/</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166" x="221" y="527.9717">(input.json, output.json)</text></g><g id="elem_GMN13"><path d="M156.5,643.9283 L156.5,730.481 A0,0 0 0 0 156.5,730.481 L461.5,730.481 A0,0 0 0 0 461.5,730.481 L461.5,653.9283 L451.5,643.9283 L313,643.9283 L309,541.0983 L305,643.9283 L156.5,643.9283 A0,0 0 0 0 156.5,643.9283 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M451.5,643.9283 L451.5,653.9283 L461.5,653.9283 L451.5,643.9283 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277" x="162.5" y="661.4966">data/ is COPY'd into the image at build time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195" x="162.5" y="676.8072">(Dockerfile: COPY data/ data/).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284" x="162.5" y="692.1177">Not a mounted volume: writes to output.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251" x="162.5" y="707.4283">do not persist across container rebuilds</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163" x="162.5" y="722.7388">unless a volume is added.</text></g><g id="elem_GMN16"><path d="M875.5,333.4983 L875.5,389.4299 L1100.5,389.4299 L1100.5,343.4983 L1090.5,333.4983 L875.5,333.4983 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1090.5,333.4983 L1090.5,343.4983 L1100.5,343.4983 L1090.5,333.4983 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204" x="881.5" y="351.0666">Single container, single process.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203" x="881.5" y="366.3772">No reverse proxy, load balancer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190" x="881.5" y="381.6877">or orchestration layer defined.</text></g><!--link Client to API--><g id="link_Client_API"><path d="M159,130.1583 C159,175.4583 159,271.9483 159,323.5483 " fill="none" id="Client-to-API" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="159,3