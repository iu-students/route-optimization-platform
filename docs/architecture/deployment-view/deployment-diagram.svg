<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1338px;height:919px;background:#FFFFFF;" width="1338px" height="919px" viewBox="0 0 1338 919" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="379.132" y="22.995" fill="#000" font-size="14" textLength="573.077" font-weight="700">Route Optimization Platform — Deployment Diagram (Deployment View)</text></g><!--cluster ClientNode--><g class="cluster" data-qualified-name="ClientNode" id="ent0001" data-source-line="3"><polygon points="165,53.297,175,43.297,357,43.297,357,135.597,347,145.597,165,145.597,165,53.297" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="347" y1="53.297" x2="357" y2="43.297" style="stroke:#181818;stroke-width:1;"/><line x1="165" y1="53.297" x2="347" y2="53.297" style="stroke:#181818;stroke-width:1;"/><line x1="347" y1="53.297" x2="347" y2="145.597" style="stroke:#181818;stroke-width:1;"/><text x="198.597" y="69.292" fill="#000" font-size="14" textLength="116.806" font-weight="700">Client Machine</text></g><!--cluster Host--><g class="cluster" data-qualified-name="Host" id="ent0003" data-source-line="7"><polygon points="16,219.597,26,209.597,969,209.597,969,640.327,959,650.327,16,650.327,16,219.597" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="959" y1="219.597" x2="969" y2="209.597" style="stroke:#181818;stroke-width:1;"/><line x1="16" y1="219.597" x2="959" y2="219.597" style="stroke:#181818;stroke-width:1;"/><line x1="959" y1="219.597" x2="959" y2="650.327" style="stroke:#181818;stroke-width:1;"/><text x="415.834" y="235.592" fill="#000" font-size="14" textLength="145.332" font-weight="700">Docker Host (VPS)</text></g><!--cluster Containe