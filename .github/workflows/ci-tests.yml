name: Tests & coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  logic-tests-mvpv3:
    name: Unit & integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flask flask-cors numpy ortools openpyxl pytest
      - name: Run logic tests (MVPv3)
        env:
          TEST_TARGET: v3
        run: python -m pytest tests/ --ignore=tests/test_qrt_004_solver_completion_time.py --ignore=tests/test_qrt_006_solver_optimality.py --ignore=tests/test_integration.py --ignore=tests/test_loaders.py --ignore=tests/test_script.py -v

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flask flask-cors numpy ortools openpyxl pytest pytest-cov
      - name: Run tests with coverage
        env:
          TEST_TARGET: v3
        run: python -m pytest tests/ --cov-config=coveragerc --cov --ignore=tests/test_qrt_004_solver_completion_time.py --ignore=tests/test_qrt_006_solver_optimality.py --ignore=tests/test_integration.py --ignore=tests/test_loaders.py --ignore=tests/test_script.py -v
      - name: Report coverage
        env:
          TEST_TARGET: v3
        run: python -m pytest tests/ --cov-config=coveragerc --cov --cov-report=term-missing --cov-report=xml --ignore=tests/test_qrt_004_solver_completion_time.py --ignore=tests/test_qrt_006_solver_optimality.py --ignore=tests/test_integration.py --ignore=tests/test_loaders.py --ignore=tests/test_script.py
