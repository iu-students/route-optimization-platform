name: CI

on:
  push:
    branches: [main, add-loader-route]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyvrp ortools numpy
          pip install pytest pytest-cov flake8 pip-audit

      - name: Lint
        run: flake8 script.py loaders.py verifier.py tester.py models.py --max-line-length=150 --ignore=E501,W503

      - name: Run tests with coverage
        run: pytest --cov=script --cov=loaders --cov=verifier --cov=tester --cov-report=term-missing

      - name: Dependency vulnerability scan
        run: pip-audit