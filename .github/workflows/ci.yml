name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install flake8
      - name: Run flake8
        run: flake8 api/ script.py loaders.py verifier.py tester.py models.py

  logic-tests:
    name: Logic tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flask flask-cors numpy pyvrp pytest
      - name: Run logic tests
        run: python -m pytest tests/ --ignore=tests/test_qrt_001_api_responsiveness.py --ignore=tests/test_qrt_002_api_confidentiality.py -v

  quality-tests:
    name: Quality requirement tests (QRT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flask flask-cors numpy pyvrp pytest
      - name: Run QRTs
        run: python -m pytest tests/test_qrt_001_api_responsiveness.py tests/test_qrt_002_api_confidentiality.py -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flask flask-cors numpy pyvrp pytest pytest-cov
      - name: Run tests with coverage
        run: python -m pytest tests/ --cov-config=coveragerc --cov -v
      - name: Report coverage
        run: python -m pytest tests/ --cov-config=coveragerc --cov --cov-report=term-missing --cov-report=xml

  security-audit:
    name: Security audit (additional QA check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install bandit
      - name: Run bandit security audit
        run: bandit -r api/ script.py loaders.py verifier.py tester.py models.py -ll

  link-check:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: |
            cache-lychee-
      - name: Create output directory
        run: mkdir -p lychee
      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          format: "markdown"
          output: "lychee/out.md"
          args: >-
            --cache
            --verbose
            --no-progress
            --exclude "http://139.100.207.201:5000"
            --exclude "http://139.100.207.201:5000/health/"
            --exclude "http://139.100.207.201:5000/solve/"
            './**/*.md'
            './reports/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save lychee cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key || 'cache-lychee-' }}
      - name: Read output
        id: read-output
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != 0
        run: |
          if [ -f "lychee/out.md" ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat lychee/out.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=No broken links found" >> $GITHUB_OUTPUT
          fi
      - name: Comment broken links in PR
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## Results of link checking

            Broken links found:

            ${{ steps.read-output.outputs.content }}

            ---
            *Checked with [lychee](https://github.com/lycheeverse/lychee)*
      - name: Fail if broken links found
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
